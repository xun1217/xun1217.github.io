        <h1>企業管理學習心得</h1>
        
        <img src="https://images.unsplash.com/photo-1456324504439-367cee10d6e6?auto=format&fit=crop&w=800&q=80" alt="學習筆記" width="400" height="250">

        <hr>

        <p style="text-align: left; line-height: 1.8;">
            透過本學期的課程，來分析 Apple、Tesla 與 TSMC 這三家世界級企業，我深刻體會到企業管理的精隨在於「定位」與「執行力」。
        </p>
        <p style="text-align: left; line-height: 1.8;">
            <strong>學習重點：</strong><br>
            1. 創新不一定只是發明新東西，更可以是舊元素的重新組合。<br>
            2. 專注的力量：台積電幾十年來只專注做一件事，這種職人精神是台灣企業的驕傲。<br>
            未來我希望將這些策略思維應用在我的職涯發展中。
        </p>
